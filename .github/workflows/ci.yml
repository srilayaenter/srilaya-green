name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

  e2e:
    name: E2E tests (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Wait for Vercel deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting for Vercel deployment (SHA: $SHA)..."

          DEPLOY_FOUND=false
          for i in $(seq 1 18); do
            DEPLOY_JSON=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&per_page=20" 2>/dev/null || echo "[]")
            DEPLOY_ID=$(echo "$DEPLOY_JSON" | jq -r 'if type == "array" then (map(select(.environment | ascii_downcase | test("preview|production"))) | first | .id // empty) else empty end')
            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              echo "Found deployment $DEPLOY_ID (attempt $i)"
              DEPLOY_FOUND=true
              break
            fi
            echo "No deployment yet (attempt $i/18)"; sleep 10
          done

          if [ "$DEPLOY_FOUND" != "true" ]; then
            echo "ERROR: No GitHub Deployment found for this SHA — aborting tests"
            exit 1
          fi

          DEPLOY_URL=""
          for j in $(seq 1 36); do
            STATUS_JSON=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" 2>/dev/null || echo "[]")
            STATE=$(echo "$STATUS_JSON" | jq -r 'if type == "array" then (first | .state // empty) else empty end')
            echo "  state=$STATE (poll $j/36)"
            if [ "$STATE" = "success" ]; then
              DEPLOY_URL=$(echo "$STATUS_JSON" | jq -r 'first | .environment_url // .target_url // empty')
              break
            elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "ERROR: Vercel build failed — aborting tests"; exit 1
            fi
            sleep 10
          done

          if [ -z "$DEPLOY_URL" ] || [ "$DEPLOY_URL" = "null" ]; then
            echo "ERROR: Deployment did not report a URL in time — aborting tests"
            exit 1
          fi

          echo "Deployment ready: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        id: run
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Used only to independently compute matching Razorpay verify/webhook
          # signatures in tests/e2e/razorpay-staging.spec.ts — the deployed app
          # reads its own copy of these from Vercel; both must match exactly.
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          # Without this, tests/e2e/helpers/db.ts's cleanup silently no-ops
          # (no .env exists in the CI checkout for Prisma to auto-load), so
          # every run's ADM-08/ADM-11 tests leak a stray product/variant
          # into the shared staging catalog and never clean it up.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CI: "true"
        run: pnpm exec playwright test --project=chromium --reporter=list

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/report/
          retention-days: 14

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u '+%d %b %Y %H:%M UTC')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '**Trigger:** Push to %s\n**Commit:** `%s` (%s)\n**Actions run:** %s\n\nCheck the Actions run for the Playwright HTML report and failure details.' \
            "${{ github.ref_name }}" "$COMMIT_SHORT" "${{ github.sha }}" "$RUN_URL")
          gh issue create \
            --title "CI: E2E tests failed on ${{ github.ref_name }} (${COMMIT_SHORT}) — ${DATE}" \
            --body "$BODY" \
            --label "bug" \
            --repo "${{ github.repository }}" || true
